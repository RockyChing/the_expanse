<div class="heading">
<h2>作者介绍</h2>
</div>
<div class="section">
<p>詹姆斯·S.A·科里是奇幻作家丹尼尔·亚伯拉罕（著有广受好评的《长价四部曲》）与作家泰·弗兰克共同使用的笔名。他们除了写作《无垠的太空》小说及其短篇故事之外，还是同名电视剧的编剧。两人均居住在新墨西哥州阿尔伯克基市。</p>
